name: GitHub 日报每日更新
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - 'public/index.html'
      - 'public/history/**'
      - 'data/translation-cache.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-daily-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 检查抓取与翻译逻辑
        run: npm test
      - name: 抓取公开来源并缓存中文翻译
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSLATION_DAILY_CHARS: '4000'
      - name: 生成静态页面
        run: npm run build
      - name: 保存每日快照与翻译缓存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public data
          if ! git diff --cached --quiet; then
            git commit -m '更新每日开源动态与中文缓存'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布公开网站
        id: deployment
        uses: actions/deploy-pages@v4
